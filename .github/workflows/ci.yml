name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: CI
    permissions:
      contents: write
      id-token: write
    outputs:
      changed: ${{ steps.version.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
      - run: npm install
      - run: npm run typecheck
      - run: npm run lint -- --deny-warnings

      # Coverage gate (MINIMUM=94). Runs the full suite under v8 coverage and
      # enforces the 94% statement/branch/function/line thresholds defined in
      # vitest.config.ts — exits non-zero if any metric falls short, failing CI.
      - name: Enforce 94% coverage (MINIMUM=94)
        run: npm test -- --coverage

      - run: npm run build

      # Publish + tag/release only when the package version changed vs. the
      # previous commit on main — a source/docs/CI-only push never publishes.
      - name: Detect version or name change
        id: version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          CUR_VER=$(node -p "require('./package.json').version")
          CUR_NAME=$(node -p "require('./package.json').name")
          PARENT=$(git rev-parse --short HEAD^ 2>/dev/null || echo "")
          if [ -z "$PARENT" ]; then
            CHANGED="true"
          else
            PREV_VER=$(git show "$PARENT:package.json" 2>/dev/null | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version" 2>/dev/null || echo "")
            PREV_NAME=$(git show "$PARENT:package.json" 2>/dev/null | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).name" 2>/dev/null || echo "")
            if [ "$CUR_VER" != "$PREV_VER" ] || [ "$CUR_NAME" != "$PREV_NAME" ]; then
              CHANGED="true"
            else
              CHANGED="false"
            fi
          fi
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"
          echo "$CUR_NAME@$CUR_VER (previous: ${PREV_NAME:-<none>}@${PREV_VER:-<none>}) — changed: $CHANGED"

      - name: Publish to npm
        if: steps.version.outputs.changed == 'true'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          NAME=$(node -p "require('./package.json').name")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION already on npm — skipping publish"
            exit 0
          fi
          npm publish --access public --provenance

      - name: Create git tag and GitHub Release
        if: steps.version.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "tag $TAG already exists — skipping release"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" --title "$TAG" --generate-notes
