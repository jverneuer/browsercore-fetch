# CI workflow for @browsercore/fetch
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-publish:
    uses: jverneuer/browsercore-dev/.github/workflows/reusable-ci.yml@main
    with:
      node-version: '26'
    permissions:
      contents: write
      id-token: write
      pages: write
