# CI for @browsercore/fetch — typecheck, lint, test, coverage, build, publish.
on:
  push:
    branches: [main, feat/platform-contracts]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-publish:
    uses: jverneuer/browsercore-dev/.github/workflows/reusable-ci.yml@7d7b9d52c9a3f768f91028aa90cf5df3a1066db4
    with:
      node-version: '26'
    permissions:
      contents: write
      id-token: write
      pages: write
